# EC2 한 대에서: API(gunicorn) + Caddy(HTTPS 자동 발급)
# DB는 RDS(PostgreSQL), 사진은 S3를 쓴다.
#
#   cd ~/Meongnyang/deploy
#   cp .env.prod.example .env.prod   # 값 채우기
#   docker compose up -d --build
services:
  api:
    build: ../server
    env_file: .env.prod
    restart: unless-stopped
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Caddyfile의 {$DOMAIN}은 .env.prod의 DOMAIN을 쓴다
    env_file: .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
