name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnop
      CI_HASH_SECRET: ci-only-not-a-real-secret-0123456789abcdefghijk
      ALLOWED_HOSTS: localhost
      IDENTITY_PROVIDER: mock
      PET_REGISTRY_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: pytest
      - name: Production settings pass deploy checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-prod-check-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: api.example.com
          ALLOW_MOCK_PROVIDERS: "True"
          BETA_INVITE_CODE: ci-invite-code
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t meongnyang-api server
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DEBUG=False -e SECRET_KEY=ci-docker-not-a-real-secret-0123456789abcdefghijklmnopqrst \
            -e CI_HASH_SECRET=ci-docker-not-a-real-secret-0123456789abcdefghijk \
            -e ALLOWED_HOSTS=api.example.com -e ALLOW_MOCK_PROVIDERS=True -e BETA_INVITE_CODE=ci-invite-code \
            meongnyang-api
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0; sleep 2; done
          docker logs api; exit 1

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
